[project]
name = "training-api"
dynamic = ["version"]
description = "Workout data store and training queue API"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "alembic>=1.14",
    "uvicorn>=0.34",
    "argon2-cffi>=23.1",
    "slowapi>=0.1.9",
    # The coach MCP, mounted in-process at /mcp (app/mcp_mount.py).
    "training-mcp",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.uv]
# The image runs the MCP from THIS lock, but its test suite runs from
# mcp/uv.lock. Hold fastmcp and the MCP SDK to the versions that suite tested; bump both
# together.
constraint-dependencies = ["fastmcp==3.1.1", "mcp==1.26.0"]

[tool.uv.sources]
training-mcp = { path = "../mcp" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/version.py"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
