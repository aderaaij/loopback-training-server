[project]
name = "training-mcp"
version = "0.1.0"
description = "MCP server for Training API - query workout data and manage training queue via AI assistants"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1"]

[project.scripts]
start = "app.main:main"

[tool.pytest.ini_options]
# The suite drives a real MCP session over FastMCP's in-memory transport.
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
